name: Deploy Quarto Site to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.39

      - name: Install System Dependencies (Xvfb & Chrome libs)
        run: |
          sudo apt-get update 
          sudo apt-get install -y xvfb zip libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2

      - name: Install Quarto Chromium
        run: quarto tools install chromium

      - name: Render Quarto Website & PDFs
        run: xvfb-run -a quarto render
        timeout-minutes: 15
        env:
          QUARTO_CHROMIUM_EXTRA_ARGS: "--no-sandbox --disable-dev-shm-usage --disable-gpu"
          QUARTO_PRINT_STACK: true
          QUARTO_LOG_LEVEL: debug

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3 
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=aptitek-desktop # <-- IMPORTANT: REPLACE WITH YOUR CLOUDFLARE PAGES PROJECT NAME
