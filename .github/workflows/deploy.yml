name: Deploy Quarto Site to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.39

      - name: Install Zip (For Filetree Lua Filter)
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Render Quarto Website & PDFs
        run: quarto render
        env:
          QUARTO_CHROMIUM_HEADLESS_MODE: new
          CHROME_PATH: /usr/bin/google-chrome
          QT_QPA_PLATFORM: offscreen
          QUARTO_CHROMIUM_EXTRA_ARGS: "--no-sandbox"
          QUARTO_PRINT_STACK: true
          QUARTO_LOG_LEVEL: debug

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3 
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=aptitek-desktop # <-- IMPORTANT: REPLACE WITH YOUR CLOUDFLARE PAGES PROJECT NAME
