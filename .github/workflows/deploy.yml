name: Deploy Quarto Site to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.39

      - name: Install Zip (For Filetree Lua Filter)
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Render Quarto Website & PDFs
        run: quarto render
        env:
          QUARTO_CHROMIUM_HEADLESS_MODE: new
          CHROME_PATH: /usr/bin/google-chrome
          QT_QPA_PLATFORM: offscreen

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: aptitek-desktop # <-- IMPORTANT: REPLACE WITH YOUR CLOUDFLARE PAGES PROJECT NAME
          directory: _site
