<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Code Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/solarized-light.min.css">
    
    <style>
        /* --- 1. CONFIGURATION SOLARIZED --- */
        :root {
            --bg-color: #fdf6e3;      /* Base3 */
            --text-color: #657b83;    /* Base00 */
            --border-color: #eee8d5;  /* Base2 */
            --btn-bg: transparent;
            --btn-hover: #eee8d5;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Recursive', monospace;
            font-variation-settings: 'MONO' 1; /* Force le code */
        }

        /* --- 2. CONTENEUR STYLE QUARTO --- */
        .sourceCode {
            margin: 0;
            position: relative; /* Pour placer le bouton Copy */
        }

        pre {
            margin: 0;
            padding: 15px;
            overflow: auto;
            font-size: 0.9em;
            line-height: 1.5;
            white-space: pre-wrap;       /* Force le retour à la ligne respectueux */
            word-break: break-word;      /* Coupe les mots trop longs (ex: URL géante) */
            overflow-wrap: break-word;
        }

        code {
            font-family: 'Recursive', monospace;
            font-variation-settings: 'MONO' 1;
            background: transparent !important; /* On laisse le body gérer le fond */
        }

        /* --- 3. BOUTON COPIER (Native Look) --- */
        .copy-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: var(--btn-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            padding: 4px 8px;
            color: #93a1a1;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .copy-btn:hover {
            background-color: var(--btn-hover);
            color: #586e75;
        }

        /* Icône Clipboard (SVG) */
        .bi-clipboard { width: 14px; height: 14px; fill: currentColor; }
        
        /* État "Copié !" */
        .copy-btn.copied {
            border-color: #859900;
            color: #859900;
        }

        /* --- 4. MESSAGE D'ERREUR --- */
        #error-msg {
            display: none;
            color: #dc322f; /* Rouge Solarized */
            padding: 20px;
            font-family: 'Recursive', sans-serif;
            font-variation-settings: 'MONO' 0;
        }
    </style>
</head>
<body>

    <div id="error-msg"></div>

    <div class="sourceCode">
        <button class="copy-btn" id="copy-btn" title="Copier le code">
            <svg class="bi-clipboard" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
                <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
                <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
            </svg>
        </button>

        <pre><code id="code-content">Chargement...</code></pre>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fileUrl = urlParams.get('file');
        const codeEl = document.getElementById('code-content');
        const btn = document.getElementById('copy-btn');
        const errEl = document.getElementById('error-msg');

        // 1. GESTION DU COPY BUTTON
        btn.addEventListener('click', () => {
            navigator.clipboard.writeText(codeEl.innerText).then(() => {
                // Feedback visuel
                const originalHTML = btn.innerHTML;
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/></svg>`;
                btn.classList.add('copied');
                
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.classList.remove('copied');
                }, 2000);
            });
        });

        // 2. CHARGEMENT DU FICHIER
        if (!fileUrl) {
            errEl.innerText = "Aucun fichier sélectionné.";
            errEl.style.display = "block";
            codeEl.parentElement.style.display = "none";
            btn.style.display = "none";
        } else {
            // Détection extension
            let ext = fileUrl.split('.').pop().toLowerCase();
            // Mapping simple pour highlight.js
            if(ext === 'js') ext = 'javascript';
            if(ext === 'py') ext = 'python';
            if(ext === 'md') ext = 'markdown';
            if(ext === 'yml') ext = 'yaml';

            // Classe pour highlight.js
            codeEl.className = `language-${ext}`;

            fetch(fileUrl)
                .then(r => {
                    if (!r.ok) throw new Error("Fichier introuvable (" + r.status + ")");
                    return r.text();
                })
                .then(text => {
                    codeEl.textContent = text;
                    // Application de la coloration
                    hljs.highlightElement(codeEl);
                })
                .catch(e => {
                    errEl.innerText = "Erreur : " + e.message;
                    errEl.style.display = "block";
                    codeEl.parentElement.style.display = "none";
                    btn.style.display = "none";
                });
        }
    </script>
</body>
</html>
